version: "3.9"

services:
  frontend:
    build: .
    ports:
      - "4200:4200"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/romet
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: